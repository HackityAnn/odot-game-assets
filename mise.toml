[tools]
python = "3.11"
uv = "0"

[tasks.check]
description = "Run Python lint, JS syntax, worker guardrails and fast unit tests"
dir = "{{config_root}}"
run = "python3 -m tools.checks"

[tasks.asset-check]
description = "Incrementally export and verify selected authored assets"
dir = "{{config_root}}"
run = "python3 -m tools.asset_pack.check"

[tasks.blender-tests]
description = "Run attachment regression tests in an isolated Blender worker"
dir = "{{config_root}}"
run = "python3 -m tools.asset_pack.worker tools/asset_pack/test_attachments_blender.py"

[tasks.catalog]
description = "Browse the local asset catalog with automatic export updates"
dir = "{{config_root}}"
run = "python3 -m tools.asset_catalog serve"

[tasks.catalog-build]
description = "Build the deployable static asset catalog in dist/catalog"
dir = "{{config_root}}"
run = "python3 -m tools.asset_catalog build"

[tasks.catalog-export]
description = "Export existing Blender asset sources without modifying them"
dir = "{{config_root}}"
run = "python3 -m tools.asset_catalog export"

[tasks.blender-mcp]
description = "Run the Blender MCP stdio server (normally started by Codex)"
run = "uvx --python 3.11 mcp-for-blender==2.1.3"
env = { UV_PYTHON_PREFERENCE = "only-managed" }

[tasks.blender-addon-install]
description = "Install or update the Blender MCP add-on"
run = "uvx --python 3.11 mcp-for-blender==2.1.3 install-addon"
env = { UV_PYTHON_PREFERENCE = "only-managed" }
